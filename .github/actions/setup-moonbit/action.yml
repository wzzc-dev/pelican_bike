name: Set up MoonBit
description: Install the MoonBit toolchain on the runner and add it to PATH.
inputs:
  version:
    description: Optional MoonBit version to install. Defaults to the latest stable.
    required: false
runs:
  using: composite
  steps:
    - name: Install MoonBit
      shell: bash
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if command -v moon >/dev/null 2>&1; then
          echo "moon already available: $(moon version --all)"
          exit 0
        fi

        # Official installer; MOONBIT_INSTALL_VERSION defaults to "latest".
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

        MOON_BIN="${MOON_HOME:-$HOME/.moon}/bin"
        echo "$MOON_BIN" >> "$GITHUB_PATH"
        export PATH="$MOON_BIN:$PATH"
        moon version --all
