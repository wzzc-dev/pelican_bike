name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev fonts-noto-color-emoji brotli

      - name: Build MoonBit web app
        run: |
          moon version --all
          moon build --target wasm-gc ./web_wasm

      - name: Package web app
        run: |
          node scripts/package-web-app.mjs web_wasm --out dist/pages

          # Minimal static-site contract that this repo can actually ship right now.
          test -f dist/pages/index.html
          test -f dist/pages/web_wasm.wasm
          test -f dist/pages/web_wasm.wasm.br
          test -f dist/pages/bundle-size.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    name: Deploy website
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
