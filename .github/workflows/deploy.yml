name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # moon.work lists ./vendor/MoUI/moui and ./vendor/MoUI/moui_web_renderer
          # as members; a missing member is a hard moon error
          # ("failed to resolve workspace member ... No such file or directory"),
          # so the vendored source has to be present before anything builds.
          submodules: true

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-bin wayland-protocols pkg-config unzip \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev fonts-noto-color-emoji brotli

      - name: Build MoonBit web app
        run: |
          moon version --all
          # The installer ships a registry snapshot; refresh it so freshly
          # published dependencies (wzzc-dev/moui et al.) resolve.
          moon update
          # Ship the optimized artifact: debug wasm-gc is ~2.7x larger and the
          # per-frame painting cost is visibly higher in the browser.
          moon build --target wasm-gc --release ./web_wasm

      - name: Package web app
        run: |
          node scripts/package-web-app.mjs web_wasm --out dist/pages

          # Minimal static-site contract that this repo can actually ship right now.
          test -f dist/pages/index.html
          test -f dist/pages/web_wasm.wasm
          test -f dist/pages/web_wasm.wasm.br
          test -f dist/pages/bundle-size.json

          # Prove the page carries the vendored (patched) runtime. An
          # uninitialized submodule directory or a stale copy would silently
          # ship the registry runtime.js instead, and the symptom would only be
          # "the site feels laggy" months later.
          grep -q upload_path_mesh dist/pages/moui_web_renderer/runtime.js
          grep -q upload_path_mesh dist/pages/moui_web_renderer/canvas2d_runtime.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    name: Deploy website
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
